# Builds the Windows installers on a real Windows runner and publishes the release.
#
# MG only ever ships as Windows binaries, and electron-builder has to run the
# Windows `rcedit` to stamp the icon and version onto electron.exe — which on
# Linux means Wine, and on macOS is not supported at all. Doing it on
# `windows-latest` sidesteps the lot.
#
# Two ways to release, both ending in the same place:
#
#   - Actions tab → Release → Run workflow, with "Publish a release" ticked.
#     The version comes from package.json and the tag is created for you, so a
#     release needs no local git at all.
#   - Push a `v*` tag, if you would rather drive it from a terminal.
#
# Either way the body comes from the notes committed at docs/releases/<tag>.md,
# so the changelog is written and reviewed alongside the change it describes
# rather than typed into a web form afterwards. A tag with no notes file still
# releases, falling back to GitHub's generated notes rather than an empty body.
#
# Running it without ticking the box just builds, leaving the installers as a
# downloadable artifact without touching releases.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (version comes from package.json)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Work out what is being released
        id: plan
        shell: pwsh
        env:
          RELEASE_REQUESTED: ${{ inputs.release }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            # A tag that disagrees with package.json would ship installers whose
            # filenames and About box name a different version than the release.
            if (($tag -replace '^v', '') -ne $version) {
              Write-Error "Tag $tag does not match package.json version $version"
              exit 1
            }
            $publish = 'true'
          } else {
            $tag = "v$version"
            $publish = if ($env:RELEASE_REQUESTED -eq 'true') { 'true' } else { 'false' }
          }

          Write-Host "version=$version tag=$tag publish=$publish"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - run: npm run typecheck

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: MG-${{ steps.plan.outputs.version }}-windows-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          $assets = (Get-ChildItem -Path release -Filter *.exe -File).FullName
          Write-Host "Attaching: $($assets -join ', ')"

          $notesFile = "docs/releases/$($env:TAG).md"
          if (Test-Path $notesFile) {
            Write-Host "Using notes from $notesFile"
            $notesArgs = @('--notes-file', $notesFile)
          } else {
            Write-Host "No $notesFile, falling back to generated notes"
            $notesArgs = @('--generate-notes')
          }

          # --target creates the tag at this commit when it does not exist yet,
          # which is what makes a release from the Actions tab possible.
          gh release create $env:TAG $assets `
            --target $env:GITHUB_SHA `
            --title "MG $($env:VERSION)" `
            $notesArgs
